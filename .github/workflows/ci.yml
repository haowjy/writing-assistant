name: checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.18'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra judging
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run cwa validate-data data/fixtures/trajectories.jsonl
      - run: uv run cwa eval --config configs/smoke.toml
