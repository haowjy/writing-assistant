[project]
name = "writing-assistant"
version = "0.0.0"
description = "Creative-writing benchmark and RL environment for long-running fiction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "httpx>=0.27",
    "numpy>=2.0",
    "spacy>=3.8,<3.9",
    "wordfreq>=3.1",
]

[project.scripts]
wa-bench = "writing_assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
