tasks = "../data/fixtures/tasks.jsonl"
output_dir = "../runs"

[backend]
kind = "chat_server"
base_url = "http://127.0.0.1:8000/v1"
model = "replace-with-served-model-name"
api_key_env = "CWA_API_KEY"
temperature = 0.0
seed = 42
max_tokens = 1024
timeout = 120

[agent]
max_steps = 8
max_tool_calls = 16
