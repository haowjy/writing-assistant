# The only configuration file. Code names an endpoint; this file maps the name to a kind,
# URL, model and key, so switching a host, provider or model touches no Python.
# kind: "openai" (chat completions), "openai-embeddings", "anthropic".
# Optional per endpoint: local = true (may receive local_dev text; absent means hosted),
# cutoff (training cutoff, for post-cutoff familiarity at report time), timeout (s),
# concurrency (requests in flight, default 16), params (extra request-body fields).
# Keys come from the environment; `wa-bench` loads `.env` from the working directory.

# -- subjects: local on the RTX 3090 (DECISIONS #13) ---------------------------------------
# Served through `llmpick` (one at a time; profiles in ~/.config/llmpick/profiles.toml), each on
# its own port so a call never reaches another model. A llama.cpp server ignores `model`; it is
# the weights file, so a run's identity names the quantisation, and run.json `served` records
# the file and engine build that answered. `concurrency` is the server's slot count: a request
# queued behind a full server would spend its timeout waiting.

[endpoints.inkling-2-mini]          # llmpick start inkling-5.4-x4 (4 slots, no drafter)
kind = "openai"
base_url = "http://127.0.0.1:18080/v1"
model = "Inkling-2-Mini-ATX-NVFP4Q8-5.4bpw.gguf"
api_key_env = ""
local = true
concurrency = 4

[endpoints."qwen3.5-9b"]            # llmpick start qwen3.5-9b-q8
kind = "openai"
base_url = "http://127.0.0.1:18083/v1"
model = "Qwen3.5-9B-Q8_0.gguf"
api_key_env = ""
local = true
concurrency = 4

[endpoints.gemma-4-26b]             # llmpick start gemma-4-26b-qat
kind = "openai"
base_url = "http://127.0.0.1:18084/v1"
model = "gemma-4-26B_q4_0-it.gguf"
api_key_env = ""
local = true
concurrency = 4

# -- subjects on DeepInfra: fallbacks only (DECISIONS #11, #13) ----------------------------

[endpoints."qwen3.5-9b-deepinfra"]
kind = "openai"
base_url = "https://api.deepinfra.com/v1/openai"
model = "Qwen/Qwen3.5-9B"
api_key_env = "DEEPINFRA_API_KEY"

[endpoints.gemma-4-26b-deepinfra]
kind = "openai"
base_url = "https://api.deepinfra.com/v1/openai"
model = "google/gemma-4-26B-A4B-it"
api_key_env = "DEEPINFRA_API_KEY"

[endpoints.inkling-2-mini-deepinfra]
kind = "openai"
base_url = "https://api.deepinfra.com/v1/openai"
model = "thinkingmachines/Inkling-2-Mini"
api_key_env = "DEEPINFRA_API_KEY"

# -- judges (DeepInfra; open weights are the primary judges, DECISIONS #11) ----------------

[endpoints.deepseek-v4-flash]
kind = "openai"
base_url = "https://api.deepinfra.com/v1/openai"
model = "deepseek-ai/DeepSeek-V4-Flash"
api_key_env = "DEEPINFRA_API_KEY"

[endpoints.hy4]
kind = "openai"
base_url = "https://api.deepinfra.com/v1/openai"
model = "tencent/Hy4"
api_key_env = "DEEPINFRA_API_KEY"
# Thinking off: with it on, Hy4 reasoned past 8192 tokens without answering on most
# author_verify pairs (2026-11-25, 7 of 8 calls at temperature 0 and 0.6); off, it answers
# in ~100 tokens. A judge's calibration holds for this setting only.
params = { chat_template_kwargs = { enable_thinking = false } }

[endpoints.deepseek-v4-pro]
kind = "openai"
base_url = "https://api.deepinfra.com/v1/openai"
model = "deepseek-ai/DeepSeek-V4-Pro"
api_key_env = "DEEPINFRA_API_KEY"

[endpoints.qwen3-embed]
kind = "openai-embeddings"
base_url = "https://api.deepinfra.com/v1/openai"
model = "Qwen/Qwen3-Embedding-0.6B"
api_key_env = "DEEPINFRA_API_KEY"

# Every value is an endpoint name. A use with no entry (embed_style: no style-embedding
# model is served anywhere yet) is unavailable: its judge raises Unscored("unavailable"),
# so whatever needs it reports itself unavailable instead of failing the run.
[judges.none]           # no judge at all: `run --judges none` plays now and scores what needs
                        # no model; `score --judges eval` judges the saved run later

[judges.eval]           # final-evaluation profile; never used as a training reward
fact = "deepseek-v4-flash"
outline = "deepseek-v4-flash"
secret_2afc = "deepseek-v4-flash"
forecast = "deepseek-v4-flash"
craft_pair = "hy4"
edit_pair = "hy4"
author_verify = "hy4"
embed_semantic = "qwen3-embed"

[judges.train]          # a different model from judges.eval for the pairwise judges
fact = "deepseek-v4-flash"
outline = "deepseek-v4-flash"
secret_2afc = "deepseek-v4-flash"
forecast = "deepseek-v4-flash"
craft_pair = "deepseek-v4-pro"
edit_pair = "deepseek-v4-pro"
author_verify = "deepseek-v4-pro"
embed_semantic = "qwen3-embed"

# "<profile>.<use>" entries whose human-label gate has passed (benchmark.md, judge stack).
# `wa-bench report` marks every metric that depends on any other model judge as ungated.
[gates]
passed = []

[storage]
bucket = ""             # private gs:// working copy for `wa-bench sync`; empty = not set up

[search]
web = ["exa", "tavily", "serper", "searxng"]         # spillover order; drop a name to remove a provider
papers = ["openalex", "s2", "exa", "arxiv"]
cache = "cache/search.sqlite"

[search.rates]           # requests per second, burst
exa = [2.0, 5]
tavily = [1.0, 3]
serper = [1.0, 3]
searxng = [0.5, 2]
arxiv = [0.33, 1]
openalex = [5.0, 10]
s2 = [1.0, 3]

[search.keys]
exa = "EXA_API_KEY"
tavily = "TAVILY_API_KEY"
serper = "SERPER_API_KEY"
